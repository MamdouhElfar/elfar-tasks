<!doctype html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="utf-8">
  <meta http-equiv="Content-Security-Policy" content="default-src 'self'; style-src 'self' 'unsafe-inline'">
  <title>Elfar Tasks quick add</title>
  <link rel="stylesheet" href="styles.css">
  <style>
    html, body { background: transparent; overflow: hidden; }
    body { padding: 2px; }
    .qa { background: var(--panel); border: 1px solid var(--border-2); border-radius: 16px; padding: 14px 16px; animation: popIn var(--dur) var(--ease); }
    .qa-head { display: flex; align-items: center; gap: 8px; color: var(--text-3); font-size: 12px; margin-bottom: 6px; }
    .qa-head .brand-mini { width: 18px; height: 18px; }
    .qa-title { width: 100%; font-size: 18px; border: none !important; background: transparent !important; padding: 6px 2px 10px !important; border-bottom: 1px solid var(--border) !important; border-radius: 0 !important; }
    .qa-row { display: flex; gap: 6px; margin-top: 10px; flex-wrap: wrap; }
    .qa-row select, .qa-row input { flex: 1 1 120px; min-width: 0; font-size: 13px; padding: 5px 6px; }
    .qa-prio { margin-top: 10px; }

    .qa-prio button.on.q1 { background: var(--q1-bg); color: var(--q1); border-color: var(--q1); }
    .qa-prio button.on.q2 { background: var(--q2-bg); color: var(--q2); border-color: var(--q2); }
    .qa-prio button.on.q3 { background: var(--q3-bg); color: var(--q3); border-color: var(--q3); }
    .qa-prio button.on.q4 { background: var(--q4-bg); color: var(--q4); border-color: var(--border-2); }
    .qa-foot { display: flex; align-items: center; margin-top: 10px; font-size: 11px; color: var(--text-3); }
    .qa-err { color: var(--danger); font-size: 12px; display: none; margin-top: 4px; }
    .qa-err.show { display: block; }
  </style>
</head>
<body>
  <div class="qa" id="qa"></div>
  <script src="logic.js"></script>
  <script src="common.js"></script>
  <script src="quick.js"></script>
</body>
</html>
