<!doctype html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="utf-8">
  <meta http-equiv="Content-Security-Policy" content="default-src 'self'; style-src 'self' 'unsafe-inline'">
  <title>Elfar Tasks reminder</title>
  <link rel="stylesheet" href="styles.css">
  <style>
    html, body { background: transparent; overflow: hidden; }
    body { padding: 10px; height: 100vh; display: flex; align-items: flex-end; justify-content: flex-end; }
    .rm { position: relative; width: 100%; display: flex; gap: 10px; align-items: flex-end; animation: walkIn .9s cubic-bezier(.25, 1.25, .45, 1) both; }
    .rm.leaving { animation: walkOut .45s ease-in forwards; }
    .rm-mouse { flex: 0 0 112px; align-self: flex-end; animation: hop .38s ease-in-out 3; transform-origin: 50% 100%; }
    .rm-mouse svg { width: 112px; height: auto; display: block; filter: drop-shadow(0 4px 8px rgba(0,0,0,.18)); }
    .rm-bell { transform-origin: 104px 38px; animation: ring .5s ease-in-out .9s 6; }
    .rm-waves path { stroke: #f6c343; stroke-width: 3; fill: none; stroke-linecap: round; opacity: 0; animation: wave 1s ease-out .9s 3; }
    .rm-waves path:nth-child(2) { animation-delay: 1.1s; }
    .rm-card { position: relative; flex: 1; min-width: 0; background: var(--panel); border: 1px solid var(--border-2); border-radius: 14px; padding: 12px 14px 10px; box-shadow: 0 10px 30px rgba(0,0,0,.22); margin-bottom: 8px; }
    .rm-card::after { content: ''; position: absolute; bottom: 18px; inset-inline-end: 100%; border: 8px solid transparent; border-inline-end-color: var(--panel); }
    [dir=rtl] .rm-card::after { inset-inline-end: auto; inset-inline-start: 100%; border-inline-end-color: transparent; border-inline-start-color: var(--panel); }
    .rm-top { display: flex; align-items: center; gap: 6px; font-size: 11.5px; color: var(--accent-text); font-weight: 600; }
    .rm-top .ico { width: 13px; height: 13px; }
    .rm-top .more { margin-inline-start: auto; color: var(--text-3); font-weight: 400; }
    .rm-x { position: absolute; top: 6px; inset-inline-end: 6px; border: none; padding: 2px 6px; color: var(--text-3); }
    .rm-title { font-size: 15px; font-weight: 700; margin: 4px 0 2px; line-height: 1.35; word-break: break-word; }
    .rm-meta { font-size: 12px; color: var(--text-2); }
    .rm-pin { font-size: 12px; background: var(--warn-bg); color: var(--warn); border-radius: 8px; padding: 4px 8px; margin-top: 6px; }
    .rm-acts { display: flex; gap: 6px; margin-top: 10px; }
    .rm-acts button { font-size: 12.5px; padding: 5px 12px; }
    .rm-card.asking { border-color: var(--accent); }
    .rm-card.thanks { text-align: center; }
    .rm-back { border: none; padding: 4px 2px 0; font-size: 11.5px; color: var(--text-3); }
    .rm-back:hover { color: var(--accent-text); }
    .rm-thanks { padding: 14px 4px; display: flex; flex-direction: column; gap: 4px; }
    .rm-thanks b { font-size: 16px; color: var(--ok); }
    .rm-thanks span { font-size: 12.5px; color: var(--text-2); }
    .rm-mouse .rm-happy { width: 96px; height: 96px; margin: 0 auto 8px; display: block; animation: hop .4s ease-in-out 2; }
    .rm-snooze { display: flex; align-items: center; gap: 4px; margin-top: 8px; font-size: 11.5px; color: var(--text-3); flex-wrap: wrap; }
    .rm-snooze button { font-size: 11.5px; padding: 2px 8px; border-radius: 99px; color: var(--text-2); }
    .rm-snooze button:hover { border-color: var(--accent); color: var(--accent-text); }
    @keyframes walkIn { 0% { transform: translateX(115%); } 70% { transform: translateX(-4%); } 100% { transform: none; } }
    [dir=rtl] .rm { animation-name: walkInR; }
    @keyframes walkInR { 0% { transform: translateX(115%); } 70% { transform: translateX(-4%); } 100% { transform: none; } }
    @keyframes walkOut { to { transform: translateX(120%); opacity: 0; } }
    @keyframes hop { 0%, 100% { transform: translateY(0) rotate(0); } 50% { transform: translateY(-7px) rotate(-3deg); } }
    @keyframes ring { 0%, 100% { transform: rotate(0); } 25% { transform: rotate(22deg); } 75% { transform: rotate(-22deg); } }
    @keyframes wave { 0% { opacity: 0; transform: scale(.7); } 30% { opacity: 1; } 100% { opacity: 0; transform: scale(1.25); } }
    @media (prefers-reduced-motion: reduce) { .rm, .rm-mouse, .rm-bell, .rm-waves path { animation-duration: .01s !important; animation-iteration-count: 1 !important; } }
  </style>
</head>
<body>
  <div id="root"></div>
  <script src="logic.js"></script>
  <script src="common.js"></script>
  <script src="remind.js"></script>
</body>
</html>
