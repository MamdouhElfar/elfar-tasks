name: "🐞 مشكلة / Report a problem"
description: "حاجة مش شغالة صح / Something isn't working right"
labels: ["bug"]
body:
  - type: markdown
    attributes:
      value: |
        شكرًا إنك بتبلّغ! اكتب بالعربي أو بالإنجليزي.
        Thanks for reporting! Arabic or English are both fine.
  - type: textarea
    id: what
    attributes:
      label: "إيه اللي حصل؟ / What happened?"
      placeholder: "مثلًا: لما بقفل التاسك المتكررة مش بتظهر المرة الجاية"
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: "عملت إيه قبلها؟ / Steps to make it happen"
      placeholder: |
        1. ...
        2. ...
  - type: textarea
    id: expected
    attributes:
      label: "كنت متوقع يحصل إيه؟ / What did you expect?"
  - type: input
    id: version
    attributes:
      label: "الإصدار / App version"
      description: "الإعدادات ← عن التطبيق / Settings → About"
  - type: textarea
    id: screenshot
    attributes:
      label: "صورة للشاشة (اختياري) / Screenshot (optional)"
      description: "اسحب الصورة هنا أو الصقها بـ Ctrl+V / Drag an image here or paste it"
